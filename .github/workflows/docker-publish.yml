name: Build and Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write

    steps:
      - name: Prepare image name (lowercase)
        id: prep
        run: echo "image_name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.prep.outputs.image_name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Install dependencies
        # 严格按 package-lock.json 安装，避免依赖升级类 PR 的 lock 解析被改写
        run: npm ci

      - name: Validate scripts
        run: |
          node --check xserver-vps-renew.mjs
          bash -n entrypoint.sh
          bash -n diagnostics.sh

      - name: Shellcheck static analysis
        run: |
          sudo apt-get update -qq && sudo apt-get install -qq -y shellcheck
          shellcheck -S warning entrypoint.sh diagnostics.sh

      - name: Run unit tests
        run: npm test

      - name: Run tests with coverage gate
        run: npm run test:coverage

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test Supercronic PID 1 startup
        run: |
          docker run --rm \
            --entrypoint /usr/local/bin/supercronic \
            "${{ env.REGISTRY }}/${{ steps.prep.outputs.image_name }}@${{ steps.build.outputs.digest }}" \
            -test /dev/null

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.prep.outputs.image_name }}:latest
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      - name: Cleanup old workflow runs (retain 5 days)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y && sudo apt-get install -y jq
          fi
          repo="$GITHUB_REPOSITORY"
          base="https://api.github.com/repos/$repo"
          cutoff=$(( $(date +%s) - 5*24*3600 ))
          echo "Looking for completed workflow runs older than 5 days (cutoff timestamp: $cutoff)..."

          ids=()
          page=1
          while :; do
            runs=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$base/actions/runs?per_page=100&page=$page")
            count=$(echo "$runs" | jq -r '.workflow_runs | length // 0')
            [ "$count" -gt 0 ] || break

            matched=$(echo "$runs" | jq -r \
              --argjson cutoff "$cutoff" \
              '.workflow_runs[] | select(.status=="completed") | select((.created_at | fromdateiso8601) < $cutoff) | .id')

            for id in $matched; do
              [ -n "$id" ] && ids+=("$id")
            done

            page=$((page+1))
          done

          echo "Found ${#ids[@]} workflow runs to delete."

          fail_count=0
          for id in "${ids[@]}"; do
            echo -n "Deleting run $id... "
            code=$(curl -sS -X DELETE -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$base/actions/runs/$id" -o /dev/null -w "%{http_code}")
            if [ "$code" = "204" ] || [ "$code" = "404" ]; then
              echo "deleted ($code)."
            else
              echo "failed with HTTP $code!" >&2
              fail_count=$((fail_count+1))
            fi
          done

          if [ "$fail_count" -gt 0 ]; then
            echo "Warning: $fail_count runs failed to delete." >&2
          fi
